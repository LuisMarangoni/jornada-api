spring.config.import=optional:file:.env[.properties]

spring.application.name=jornada-api
server.port=${SERVER_PORT:8082}

spring.datasource.url=${JORNADA_DB_URL:jdbc:postgresql://localhost:5434/jornada_db}
spring.datasource.username=${JORNADA_DB_USERNAME:jornada_app}
spring.datasource.password=${JORNADA_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}