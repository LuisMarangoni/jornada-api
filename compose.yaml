services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jornada_db
      POSTGRES_USER: jornada_app
      POSTGRES_PASSWORD: ${JORNADA_DB_PASSWORD:?Configure JORNADA_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - jornada_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jornada_app -d jornada_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jornada_data: